<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img">
  <title>Ohm's law sweep schematic</title>
  <desc>A six volt source and twelve ohm resistor in a complete series loop.</desc>
  <rect width="720" height="220" rx="18" fill="#102a27"/>
  <g fill="none" stroke="#dbece4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 55H430M590 55H650V175H90V55"/>
    <path d="M430 55l18-16 28 32 28-32 28 32 28-32 28 32 28-32 26 16"/>
    <path d="M72 94h36M80 112h20"/>
  </g>
  <g fill="#ffd47a" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">
    <text x="90" y="145">6 V DC</text><text x="510" y="112">12 Ω</text><text x="355" y="202">I = 0.5 A</text>
  </g>
</svg>
