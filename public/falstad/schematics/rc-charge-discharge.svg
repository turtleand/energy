  <g fill="#ffd47a" font-family="system-ui,sans-serif" font-size="20" text-anchor="middle">
    <text x="105" y="145">5 V</text><text x="270" y="100">switch</text><text x="555" y="120">10 kΩ</text><text x="565" y="196">100 µF</text><text x="330" y="235">τ = RC = 1 s</text>
